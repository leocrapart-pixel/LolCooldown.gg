[package]
name = "cooldownlol-desktop"
version = "1.0.0"
description = "League of Legends ability cooldowns, ranges and effect radii, offline"
authors = ["CooldownLol.gg"]
license = "MIT"
repository = "https://github.com/leocrapart-pixel/LolCooldown.gg"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "cooldownlol_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Only used to surface startup problems in debug builds.
tauri-plugin-log = { version = "2", optional = true }
log = { version = "0.4", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["debug-log"]
debug-log = ["dep:tauri-plugin-log", "dep:log"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
